name: fight_s3
hypothesis: >
  In combat practice maps only, paying part of the exit reward according to kills, and more per kill,
  makes the agent fight more without dying more or losing navigation. Compare with the `full` run.
# Started on 2026-11-26 from the `full` run's checkpoint (see docs/EXPERIMENTS.md). Same settings as
# configs/full.yaml except the two combat rewards, more combat practice and the ASUS worker count.
seed: 3
total_steps: 300000000
max_hours: 14
num_workers: 10
envs_per_worker: 8
odom_warmup_updates: 60
eval_minutes: 30
eval_maps_per_tier: 6     # unchanged, so held-out scores stay comparable with the other runs
model:
  memory: true
  slots: 32
  memory_mode: anchored
  two_timescale: false
  use_depth: false
ppo:
  rollout: 128
  seq_len: 32
  minibatches: 8
  epochs: 3
env:
  reward:
    combat_exit_floor: 0.5   # leaving a combat map with no kills pays half the exit reward
    combat_kill_scale: 2.5   # combat maps: 0.75 per kill instead of 0.3
director:
  # Dictionaries replace the defaults entirely, so every family is listed.
  family_weight: {movement: 1.0, combat: 2.5, explore: 1.5, progression: 2.5, gauntlet: 2.5}   # combat was 1.5
