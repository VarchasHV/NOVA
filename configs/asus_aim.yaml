name: aim_s5
hypothesis: >
  Paying for damage dealt teaches aiming; more switch exits and a small reward for trying walls with
  USE raise the finish rate on switch maps. Compare with the starting checkpoint on the same maps.
# Started on 2026-11-27 from the `full` run's checkpoint (see docs/EXPERIMENTS.md). Same as
# configs/asus_variety.yaml plus the three practice changes below.
seed: 5
total_steps: 300000000
max_hours: 14
num_workers: 10
envs_per_worker: 8
odom_warmup_updates: 60
eval_minutes: 30
eval_maps_per_tier: 6     # the plain suite, so held-out scores stay comparable with the other runs
model:
  memory: true
  slots: 32
  memory_mode: anchored
  two_timescale: false
  use_depth: false
ppo:
  rollout: 128
  seq_len: 32
  minibatches: 8
  epochs: 3
env:
  variety: 0.6
  freedoom_slots: 2
  switch_share: 0.85       # was 0.5
  reward:
    combat_kill_scale: 2.0
    hit: 0.006             # per HP dealt: a 60 HP imp is worth 0.36 in hits, plus the kill
    hit_cap: 3.0
    use_spot: 0.04
    use_spot_cap: 1.0
