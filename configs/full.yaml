name: full
hypothesis: Streamed memory (K=32) with the full curriculum is our submission candidate.
seed: 1
# Training stops at whichever comes first; the curriculum schedule follows the same progress value.
total_steps: 300000000
max_hours: 16
num_workers: -1          # CPU threads - 2 (tools/check_setup.py suggests a value)
envs_per_worker: 8
odom_warmup_updates: 60
eval_minutes: 30
eval_maps_per_tier: 6
model:
  memory: true
  slots: 32
  memory_mode: anchored  # "soft" if organisers reject position-anchored writes
  two_timescale: false
  use_depth: false
ppo:
  rollout: 128
  seq_len: 32
  minibatches: 8
  epochs: 3
