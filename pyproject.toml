[project]
name = "devforge-doom-template"
version = "0.1.0"
description = "BBB (Bictor Bon Boom): DevForge 'Can It Play DOOM?' (Yugaantar 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "doom-env",
    "vizdoom==1.3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
    # Same version as the official base image (docker/requirements.lock).
    "torch==2.15.0",
    # Training only (all of these are also in the base image).
    "pyyaml>=6.0",
    "tensorboard>=2.19",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv.sources]
doom-env = { path = "env", editable = true }
# The PyPI torch wheel for Windows is CPU-only; take the CUDA build there. Linux PyPI wheels
# already include CUDA, and macOS has no CUDA.
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
